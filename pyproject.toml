[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldservice-sms-approval-kit"
version = "0.1.0"
description = "Register field-service SMS signatures and templates, then decide when a photographed work order needs a follow-up."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fieldservice_sms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

